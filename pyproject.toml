[project]
name = "llm-sanitizer"
version = "0.5.1"
description = "CLI + MCP server for detecting, classifying, and redacting embedded LLM agent instructions in documents, source code, and web pages."
readme = {file = "README.md", content-type = "text/markdown"}
authors = [{name = "Gregory R. Warnes", email = "greg@warnes-innovations.com"}]
license = {text = "AGPL-3.0-or-later"}
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = [
	"agent",
	"llm",
	"mcp",
	"model-context-protocol",
	"prompt-injection",
	"sanitizer",
	"scanner",
	"security",
]
classifiers = [
	"Development Status :: 3 - Alpha",
	"Environment :: Console",
	"Intended Audience :: Developers",
	"Intended Audience :: Information Technology",
	"License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
	"Operating System :: OS Independent",
	"Programming Language :: Python :: 3",
	"Programming Language :: Python :: 3.11",
	"Programming Language :: Python :: 3.12",
	"Topic :: Security",
	"Topic :: Software Development",
	"Topic :: Software Development :: Libraries :: Python Modules",
	"Typing :: Typed",
]
dependencies = [
	# UPPER BOUND IS LOAD-BEARING. This was declared `mcp>=1.0` (unbounded), and
	# when mcp 2.0 removed `mcp.server.fastmcp` every fresh install of
	# llm-sanitizer — including 0.3.0 and 0.4.0 — died at import with
	# ModuleNotFoundError. CI never caught it because every check ran against
	# uv.lock, which pinned mcp 1.27; consumers resolve from THIS constraint, not
	# from our lock. The wheel-install CI job (no lockfile) now guards that gap.
	# We target the 2.x API (MCPServer); 1.x had FastMCP instead and the two are
	# mutually exclusive, so this floor is a hard requirement, not a preference.
	"mcp>=2.0,<3",
	# Upper bounds below are the same belt-and-suspenders policy as mcp above
	# (see its comment): each caps at the next major above what's currently
	# locked (uv.lock), so a fresh consumer resolve can't silently jump a
	# breaking major the way `mcp>=1.0` and `py7zr>=0.20` (see the 7z extra
	# below) both did.
	"httpx>=0.27,<1",
	"pydantic>=2.0,<3",
	# Pure-Python (MIT) magic-byte type detection for Tier-1 extension-vs-content
	# mismatch checks. Matches only known binary signatures (returns None for
	# text/source), which keeps the check free of content-heuristic false positives.
	"filetype>=1.2,<2",
	# Pure-Python (BSD) PDF parser for Tier-2 bounded structural validation.
	"pypdf>=4.0,<7",
	# Binary document text extraction. A CORE dependency, not optional: the
	# file-scanning path (scan_file/scan_dir/redact_file) — and the downstream
	# flow-guard sanitization protocol that relies on it — cannot scan binary
	# documents without an extractor, and a server that silently can't scan a
	# PDF fails closed in a way that surprises callers (unscannable_binary /
	# status:"error" on every binary). Keeping it in base deps means the MCP
	# server can never launch unable to scan binaries.
	#
	# The per-format extras are REQUIRED: base markitdown parses no format at
	# all (it raises MissingDependencyException, which surfaces as a critical
	# unscannable_binary finding). Pin exactly the document types the protocol
	# handles — PDF, DOCX, PPTX, XLSX/XLS — and deliberately exclude the
	# markitdown[all] bloat (azure-doc-intelligence, audio transcription,
	# youtube) that has no place in a security scanner.
	"markitdown[pdf,docx,pptx,xlsx,xls]>=0.1,<1",
	# Pure-Python (BSD) RTF text extraction. markitdown does NOT handle RTF
	# (it raises UnsupportedFormatException for '.rtf'), and RTF is ASCII, so
	# it sniffs as text and would otherwise be rule-scanned as raw control
	# words. A CORE dependency for the same reason as markitdown: the scanner
	# must never be silently unable to read a format it is handed.
	"striprtf>=0.0.26,<1",
]

[dependency-groups]
test = [
	"pytest>=9.0.3",
	"pytest-asyncio>=1.3.0",
	"pytest-cov>=7.1.0",
	"pytest-timeout>=2.4.0",
	"pytest-xdist>=3.8.0",
]
# Static type-checking. mypy is configured strict ([tool.mypy]) but was not
# declared as a dependency anywhere; declare it here so the strict check is
# reproducible. install-deps.sh installs this unless --no-dev is passed.
dev = [
	"mypy>=1.13",
]

[project.optional-dependencies]
# markitdown is now a CORE dependency (see [project] dependencies above), so
# binary document scanning works out of the box. This extra is retained as a
# no-op for backward compatibility: `pip install llm-sanitizer[binary]` and any
# docs/scripts/protocol text that still reference the [binary] extra keep
# resolving without error.
binary = []
# 7z archive extraction. py7zr is LGPL-3.0 (dynamically imported, AGPL-compatible).
#
# UPPER AND RAISED LOWER BOUND ARE LOAD-BEARING. This was declared
# `py7zr>=0.20` (unbounded), and py7zr 1.0 removed `SevenZipFile.readall()`;
# every fresh install of llm-sanitizer[7z] resolved 1.x and every valid .7z
# archive reported CRITICAL corrupt_file instead of being expanded (same bug
# class as the mcp>=1.0 incident — see mcp's comment above). The reader now
# targets py7zr's 1.x extraction API (`SevenZipFile.extract()` with a custom
# `py7zr.io.WriterFactory`, which does not exist before 1.0 — verified absent
# in the 0.20.0/0.21.0/0.22.0 wheels), so the *floor* also had to move to 1.0,
# not just gain a ceiling.
7z = ["py7zr>=1.0,<2"]
# RAR (and general libarchive-backed) extraction. libarchive-c wraps the
# BSD-licensed libarchive; the Python wrapper is CC0. Requires the system
# libarchive shared library to be installed. Bounded for the same reason as
# 7z above; the reader's use of file_reader()/.isdir/.pathname/.get_blocks()
# was verified against libarchive-c 5.3 (current at time of writing) and
# still matches, but an unbounded upper is exactly what let the 7z break ship.
rar = ["libarchive-c>=5.0,<6"]

[project.urls]
Homepage = "https://github.com/Warnes-Innovations/llm-sanitizer"
Repository = "https://github.com/Warnes-Innovations/llm-sanitizer"
Issues = "https://github.com/Warnes-Innovations/llm-sanitizer/issues"
Changelog = "https://github.com/Warnes-Innovations/llm-sanitizer/blob/main/CHANGELOG.md"

[project.scripts]
llm-sanitizer = "llm_sanitizer.server:main"
llm-sanitize = "llm_sanitizer.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
exclude = [
	"src/llm_sanitizer/.mypy_cache/**",
	"src/llm_sanitizer/__pycache__/**",
]

[tool.hatch.build.targets.sdist]
include = [
	"/CHANGELOG.md",
	"/LICENSE",
	"/README.md",
	"/docs",
	"/pyproject.toml",
	"/src",
	"/tests",
]

[tool.hatch.build.targets.wheel]
packages = ["src/llm_sanitizer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
strict = true

# Optional/third-party modules without bundled type stubs (or optional at
# runtime). ignore_missing_imports keeps the strict check environment-
# independent: a no-op when the module is installed and typed, and it suppresses
# import errors when the module is absent (these imports are lazy, guarded by
# try/except ImportError).
[[tool.mypy.overrides]]
module = ["py7zr", "markitdown", "pypdf", "filetype", "libarchive"]
ignore_missing_imports = true
