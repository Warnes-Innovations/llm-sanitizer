#
# Sensitivity of every tracked file. Checked by `bastion classify`.
#
# Valid: privileged, security-sensitive, internal, public-safe
#
# `bastion classify` reports what is unclassified; it never assigns a value. Every entry
# below is a decision someone made, and the rationale exists so it can be disagreed with.
#
# A file matched by several rules takes the MOST restrictive of them.
#
# ---------------------------------------------------------------------------
# THIS REPOSITORY IS ALREADY PUBLIC. `public-safe` here is a statement of fact, not an
# intention — every tracked file is on GitHub right now, readable by anyone.
#
# The manifest still earns its place, for two reasons:
#
#   1. It makes the next addition deliberate. A new file is UNCLASSIFIED until someone
#      says otherwise, and in a repo that is already public that is the moment to notice
#      something does not belong.
#   2. This is a SECURITY TOOL. Its own weaknesses are the sensitive category to watch —
#      a finding about llm-sanitizer that is not yet fixed would be `security-sensitive`
#      and would not belong in this repo at all. None exists today.
#
# NOT COVERED HERE, because it is not tracked: .specstory/ holds ~29 MB of agent session
# transcripts, gitignored and unpublished. gitleaks reports 14 findings across them; of
# the six distinct values, four are demonstrably placeholders (two Slack webhooks whose
# tails are a 24-character single-character run — the documented example — plus an
# api_key containing "abc" and "123456"), and two 36-char authToken values are of
# undetermined origin. They are not in git and are not published. SpecStory now writes
# new transcripts to ~/src/confidential/transcripts instead, so this directory will not
# grow further.
# ---------------------------------------------------------------------------
version: 1

rules:
  - path: "src/**"
    sensitivity: public-safe
    rationale: "Shipped source of a published AGPL tool."

  - path: "tests/**"
    sensitivity: public-safe
    rationale: >
      Test suite. Contains deliberately secret-SHAPED fixtures — that is the point of
      testing a secret scanner — but they are synthetic and already public.

  - path: "docs/**"
    sensitivity: public-safe
    rationale: "Design spec, data-handling notes, announcement copy. Published."

  - path: "data-raw/**"
    sensitivity: public-safe
    rationale: >
      Dataset fetchers and pinned revisions for public corpora. Records which public
      sources are used and at which revision; no private data.

  - path: "scripts/**"
    sensitivity: public-safe
    rationale: "Maintenance scripts for a published project."

  - path: ".personas/**"
    sensitivity: public-safe
    rationale: >
      Reviewer personas and their committee-review outputs. Reviews of a public tool,
      published alongside it — the honest-disclosure posture this project takes.

  - path: ".github/**"
    sensitivity: public-safe
    rationale: >
      CI, issue templates, and the CLA workflow. Secrets referenced by name only.

  - path: ".claude/**"
    sensitivity: public-safe
    rationale: "A publish command definition; no credentials, no machine paths."

  - path: "wiki/**"
    sensitivity: public-safe
    rationale: >
      Project wiki. The per-page sensitivity field is NOT enabled here; enable it in
      wiki/SCHEMA.md if this wiki ever accumulates findings about unfixed weaknesses.

  - path: "*"
    sensitivity: public-safe
    rationale: >
      Repo-root files: README, LICENSE, CLA, DCO, CONTRIBUTING, pyproject, linter and
      scanner configs. All already public. Matches root files ONLY (`*` is `[^/]*`).
