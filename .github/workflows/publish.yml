#
# Publishes llm-sanitizer to PyPI using OIDC Trusted Publishing.
# Triggered when a GitHub release is published.
#
# PyPI setup (one-time):
#   https://pypi.org/manage/account/publishing/
#   Add pending publisher:
#     project name : llm-sanitizer
#     owner        : Warnes-Innovations
#     repository   : llm-sanitizer
#     workflow     : publish.yml
#     environment  : pypi

name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      # Actions are pinned to immutable commit SHAs (committee M5/SEC-2): a
      # mutable tag/branch ref in a workflow that holds `id-token: write` publish
      # rights is a supply-chain risk. Dependabot (github-actions) proposes SHA
      # bumps; the trailing comment records the human-readable version.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0

      - name: Build wheel and sdist
        run: uv build --out-dir dist/

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/llm-sanitizer/
    permissions:
      id-token: write   # required for OIDC trusted publishing

    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247  # release/v1
