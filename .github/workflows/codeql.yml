#
# CodeQL static security analysis (committee CR-2 / DevOps: no code scanning ran
# before). Python is interpreted, so no build step is needed. Actions pinned to
# immutable commit SHAs (committee M5/SEC-2).
name: CodeQL

on:
  push:
    branches: [devel, main]
  pull_request:
    branches: [devel, main]
  schedule:
    - cron: "27 3 * * 1"  # weekly, Monday 03:27 UTC

jobs:
  analyze:
    name: analyze (python)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3  # v4.37.6
        with:
          languages: python
          queries: security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd  # v4.37.7
        with:
          category: "/language:python"
